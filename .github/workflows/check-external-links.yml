name: Vérifier tous les liens
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Liens internes et externes
        run: npm run check:external
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-complet-des-liens
          path: link-report.md
          if-no-files-found: ignore
